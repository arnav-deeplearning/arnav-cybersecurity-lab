{% extends "base.html" %}
{% block title %}{{ project.title }} | {{ site.title }}{% endblock %}
{% block content %}

<section class="section" style="padding-top: 48px;">
  <div class="container">
    <a class="back-link" href="apps.html">&larr; All apps</a>
    <div class="section-head">
      <span class="eyebrow">Learn &amp; Practice</span>
      <h2>{{ project.icon }} {{ project.title }}</h2>
      <p>{{ project.description }}</p>
    </div>

    <div class="filter-bar">
      <div class="filter-field">
        <label for="levelSelect">Level</label>
        <select id="levelSelect">
          <option value="all">All levels</option>
          {% for level in levels %}
          <option value="{{ level }}">{{ level }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="filter-field">
        <label for="categorySelect">Category</label>
        <select id="categorySelect">
          <option value="all">All categories</option>
          {% for category in categories %}
          <option value="{{ category.id }}">{{ category.label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="filter-field filter-field-actions">
        <label>&nbsp;</label>
        <div class="demo-actions">
          <button type="button" class="btn btn-ghost" id="shuffleBtn">Shuffle</button>
          <button type="button" class="btn btn-ghost" id="resetProgressBtn">Reset Progress</button>
        </div>
      </div>
    </div>

    <div class="deck-progress">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label muted" id="progressLabel"></div>
    </div>

    <div class="flashcard-stage" id="flashcardStage">
      <div class="flashcard" id="flashcard">
        <div class="flashcard-face flashcard-front">
          <span class="flashcard-level" id="cardLevel"></span>
          <div class="flashcard-term" id="cardTerm"></div>
          <span class="muted flashcard-hint">Click to flip</span>
        </div>
        <div class="flashcard-face flashcard-back">
          <div class="flashcard-definition" id="cardDefinition"></div>
          <div class="flashcard-example muted" id="cardExample"></div>
        </div>
      </div>
    </div>

    <div class="deck-actions">
      <button type="button" class="btn btn-ghost" id="prevBtn">&larr; Prev</button>
      <button type="button" class="btn btn-danger" id="stillLearningBtn">Still Learning</button>
      <button type="button" class="btn btn-primary" id="gotItBtn">Got It</button>
      <button type="button" class="btn btn-ghost" id="nextBtn">Next &rarr;</button>
    </div>

    <div id="deckEmpty" class="card deck-empty" style="display:none;">
      <h3>Deck complete</h3>
      <p id="deckSummary"></p>
      <button type="button" class="btn btn-primary" id="restartBtn">Restart Deck</button>
    </div>
  </div>
</section>

<script id="flashcards-data" type="application/json">{{ cards_json | safe }}</script>
<script src="static/js/flashcards.js"></script>
{% endblock %}
